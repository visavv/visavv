<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc"><title id="title">Claude Usage Band</title><desc id="desc">A band of usage meters: context window, 5-hour and 7-day limits with pace ticks, and Codex.</desc><rect width="600" height="340" rx="20" fill="#071d41"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="44" fill="#9acbff" font-size="14" letter-spacing="2.5">04 / CLAUDE CODE PLUGIN</text><text x="32" y="86" fill="#ffffff" font-size="32" font-weight="700">Claude Usage Band</text><text x="32" y="116" fill="#ccddf2" font-size="18">Claude and Codex quota, always on screen.</text><rect x="32" y="140" width="536" height="168" rx="14" fill="#102e56" stroke="#35587e"/><text x="52" y="177" fill="#ccddf2" font-size="15" font-family="Consolas,Menlo,monospace">ctx</text><rect x="118" y="164" width="290" height="16" rx="8" fill="#194479"/><rect x="118" y="164" width="122" height="16" rx="8" fill="#70afff"/><text x="424" y="177" fill="#ccddf2" font-size="14">42%</text><text x="52" y="212" fill="#ccddf2" font-size="15" font-family="Consolas,Menlo,monospace">5h</text><rect x="118" y="199" width="290" height="16" rx="8" fill="#194479"/><rect x="118" y="199" width="197" height="16" rx="8" fill="#6ee7a8"/><rect x="278" y="195" width="3" height="24" fill="#ffffff"/><text x="424" y="212" fill="#ccddf2" font-size="14">resets 1h 40m</text><text x="52" y="247" fill="#ccddf2" font-size="15" font-family="Consolas,Menlo,monospace">7d</text><rect x="118" y="234" width="290" height="16" rx="8" fill="#194479"/><rect x="118" y="234" width="102" height="16" rx="8" fill="#ffc86b"/><rect x="263" y="230" width="3" height="24" fill="#ffffff"/><text x="424" y="247" fill="#ccddf2" font-size="14">behind pace</text><text x="52" y="282" fill="#ccddf2" font-size="15" font-family="Consolas,Menlo,monospace">codex</text><rect x="118" y="269" width="290" height="16" rx="8" fill="#194479"/><rect x="118" y="269" width="58" height="16" rx="8" fill="#437bd2"/><text x="424" y="282" fill="#ccddf2" font-size="14">20%</text></g></svg>